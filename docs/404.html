<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>No Logo — Integrated Communication Agency</title>
  <script>
    // SPA routing for GitHub Pages — encodes the current path into a query
    // string so index.html can restore it before Angular boots.
    // pathSegmentsToKeep = 1  →  keeps /nologo/ prefix for project pages
    var segmentsToKeep = 1;
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.host +
      l.pathname.split('/').slice(0, 1 + segmentsToKeep).join('/') + '/?/' +
      l.pathname.slice(1).split('/').slice(segmentsToKeep).join('/').replace(/&/g, '~and~') +
      (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body></body>
</html>
