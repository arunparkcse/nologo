# Decap CMS — local-only. `npm start` runs decap-server, which reads/writes
# src/content/** directly on disk. Nothing is committed or published automatically:
# review the changes, then build and deploy as usual.
# Talk straight to decap-server — no hosted login, so there's never an email/password screen.
# 127.0.0.1, not "localhost": decap-server only listens on IPv4, and browsers that resolve
# localhost to IPv6 (::1) first would fail to connect.
backend:
  name: proxy
  proxy_url: http://127.0.0.1:8081/api/v1

media_folder: src/assets/uploads
public_folder: assets/uploads

# Shared field shapes are YAML anchors (&name) defined at first use and reused (*name).
collections:
  # ── Portfolio categories (each is a page at /<slug>) ──────────────
  - name: categories
    label: Categories
    label_singular: Category page
    description: "Each category is a portfolio page (Film, Photography, …). Add one to create a new page — it gets its own address, menu link, and a grid of the projects assigned to it."
    folder: src/content/categories
    extension: json
    format: json
    create: true
    delete: true
    slug: "{{fields.slug}}"
    identifier_field: name
    summary: "{{name}} — /{{fields.slug}}"
    sortable_fields: [order, name]
    fields:
      - &order { label: Display order, name: order, widget: number, value_type: int, required: false, hint: "Lower numbers appear first. Leave empty to show last." }
      - { label: URL slug, name: slug, widget: string, pattern: ["^[a-z0-9-]+$", "Lowercase letters, numbers and hyphens only"], hint: "The page address, e.g. events → /events. Can't be about, careers, contact, perspectives, admin or assets. Don't change it once projects use it." }
      - { label: Name, name: name, widget: string, hint: "Shown on the portfolio tabs and in the browser tab, e.g. Events" }
      - label: Page design
        name: layout
        widget: select
        default: featured
        options:
          - { label: "Featured — one large item, then a grid (like Film)", value: featured }
          - { label: "Masonry — large item, then mixed-size tiles (like Photography)", value: masonry }
          - { label: "Showcase — two large items, then a grid (like Creative)", value: showcase }
          - { label: "Impact — stats, intro and services, then a grid (like CSR)", value: impact }
      - { label: Menu label, name: navLabel, widget: string, required: false, hint: "Shorter name for the top menu. Defaults to Name." }
      - { label: Footer label, name: footerLabel, widget: string, required: false, hint: "Name in the footer's Services list. Defaults to Name." }
      - { label: Show in top menu, name: showInNav, widget: boolean, default: true, required: false }
      - { label: Show in footer, name: showInFooter, widget: boolean, default: true, required: false }
      - { label: Hero background image, name: heroImage, widget: image, required: false }
      - &hero
        label: Page hero
        name: hero
        widget: object
        fields:
          - { label: Small label, name: label, widget: string }
          - { label: Title (new line = line break), name: title, widget: text }
          - { label: Accent character, name: accent, widget: string, required: false, hint: "Shown in red after the title, e.g. . or ?" }
          - { label: Subtitle, name: sub, widget: text }
      - { label: Featured item label, name: featuredLabel, widget: string, required: false, hint: "'Featured' design only, e.g. Featured Film" }
      - label: Impact stats
        name: stats
        widget: list
        required: false
        hint: "'Impact' design only"
        fields:
          - { label: Number, name: number, widget: string }
          - { label: Label, name: label, widget: string }
      - label: Intro
        name: intro
        widget: object
        required: false
        hint: "'Impact' design only"
        fields:
          - { label: Small label, name: label, widget: string, required: false }
          - { label: Heading (new line = line break), name: title, widget: text, required: false }
          - { label: Paragraphs, name: paragraphs, widget: list, required: false, field: { label: Paragraph, name: paragraph, widget: text } }
      - { label: Services label, name: servicesLabel, widget: string, required: false, hint: "'Impact' design only" }
      - { label: Services, name: services, widget: list, required: false, hint: "'Impact' design only. Comma separated" }
      - label: Call-to-action band
        name: cta
        widget: object
        fields:
          - { label: Small label, name: label, widget: string }
          - { label: Heading (new line = line break), name: title, widget: text }
          - { label: Accent character, name: accent, widget: string, required: false }
          - { label: Button text, name: buttonLabel, widget: string }

  # ── Custom pages (built from sections) ────────────────────────────
  - name: customPages
    label: Custom Pages
    label_singular: Custom page
    description: "Build a new page from ready-made sections (the same designs used across the site). Each page lives at /<slug>."
    folder: src/content/custom-pages
    extension: json
    format: json
    create: true
    delete: true
    slug: "{{fields.slug}}"
    identifier_field: title
    summary: "{{title}} — /{{fields.slug}}"
    sortable_fields: [order, title]
    fields:
      - *order
      - { label: URL slug, name: slug, widget: string, pattern: ["^[a-z0-9-]+$", "Lowercase letters, numbers and hyphens only"], hint: "The page address, e.g. awards → /awards. Can't match a category or be about, careers, contact, perspectives, admin or assets." }
      - { label: Page title, name: title, widget: string, hint: "Shown in the browser tab, and as the menu/footer label unless set below" }
      - { label: Show in top menu, name: showInNav, widget: boolean, default: false, required: false }
      - { label: Menu label, name: navLabel, widget: string, required: false }
      - { label: Show in footer, name: showInFooter, widget: boolean, default: false, required: false }
      - { label: Footer label, name: footerLabel, widget: string, required: false }
      - label: Sections
        name: sections
        widget: list
        label_singular: section
        hint: "Add sections in the order they should appear. Drag to reorder."
        types:
          - label: Hero (page header)
            name: hero
            widget: object
            summary: "Hero — {{fields.title}}"
            fields:
              - { label: Small label, name: label, widget: string }
              - { label: Title (new line = line break), name: title, widget: text }
              - { label: Accent character, name: accent, widget: string, required: false, hint: "Shown in red after the title, e.g. . or ?" }
              - { label: Subtitle, name: sub, widget: text, required: false }
              - { label: Background image, name: image, widget: image, required: false }
          - label: Text
            name: text
            widget: object
            summary: "Text — {{fields.title}}"
            fields:
              - { label: Small label, name: label, widget: string, required: false }
              - { label: Heading (new line = line break), name: title, widget: text, required: false }
              - { label: Accent character, name: accent, widget: string, required: false }
              - { label: Paragraphs, name: paragraphs, widget: list, field: { label: Paragraph, name: paragraph, widget: text }, hint: "Wrap words in **double asterisks** for bold" }
          - label: Image + text
            name: imageText
            widget: object
            summary: "Image + text — {{fields.title}}"
            fields:
              - { label: Image, name: image, widget: image }
              - { label: Image position, name: imagePosition, widget: select, options: [left, right], default: left, required: false }
              - { label: Badge number, name: badgeNumber, widget: string, required: false, hint: "Optional red badge on the image, e.g. 2010" }
              - { label: Badge label, name: badgeLabel, widget: string, required: false }
              - { label: Small label, name: label, widget: string, required: false }
              - { label: Heading (new line = line break), name: title, widget: text, required: false }
              - { label: Paragraphs, name: paragraphs, widget: list, field: { label: Paragraph, name: paragraph, widget: text }, hint: "Wrap words in **double asterisks** for bold" }
              - { label: Button text, name: buttonLabel, widget: string, required: false }
              - { label: Button link, name: buttonLink, widget: string, required: false, hint: "A site path like /contact, or a full URL (opens in a new tab)" }
          - label: Stats bar
            name: stats
            widget: object
            summary: "Stats bar"
            fields:
              - label: Stats
                name: items
                widget: list
                fields:
                  - { label: Number, name: value, widget: string }
                  - { label: Suffix (red), name: suffix, widget: string, required: false, hint: "e.g. +" }
                  - { label: Label, name: label, widget: string }
          - label: Numbered cards
            name: cards
            widget: object
            summary: "Cards — {{fields.title}}"
            fields:
              - { label: Style, name: theme, widget: select, options: [{ label: "Dark (like Our Values)", value: dark }, { label: "Light (like What We Do)", value: light }], default: dark, required: false }
              - { label: Small label, name: label, widget: string, required: false }
              - { label: Heading (new line = line break), name: title, widget: text, required: false }
              - label: Cards
                name: items
                widget: list
                fields:
                  - { label: Title, name: title, widget: string }
                  - { label: Description, name: desc, widget: text }
          - label: Quote
            name: quote
            widget: object
            summary: "Quote — {{fields.quote}}"
            fields:
              - { label: Small label, name: label, widget: string, required: false }
              - { label: Quote, name: quote, widget: text }
              - { label: Quote emphasis (italic), name: emphasis, widget: string, required: false }
              - { label: Body, name: body, widget: text, required: false }
          - label: Service cards
            name: services
            widget: object
            summary: "Services — {{fields.title}}"
            fields:
              - { label: Small label, name: label, widget: string, required: false }
              - { label: Heading (new line = line break), name: title, widget: text, required: false }
              - label: Cards
                name: items
                widget: list
                fields:
                  - { label: Title, name: title, widget: string }
                  - { label: Description, name: desc, widget: text }
                  - { label: Tags, name: tags, widget: list, required: false }
                  - { label: Link, name: link, widget: string, required: false, hint: "A site path like /films, or a full URL" }
          - label: Projects grid
            name: projects
            widget: object
            summary: "Projects — {{fields.title}}"
            fields:
              - { label: Small label, name: label, widget: string, required: false }
              - { label: Heading (new line = line break), name: title, widget: text, required: false }
              - { label: Pick specific projects, name: projects, widget: relation, collection: projects, value_field: slug, search_fields: [title, client], display_fields: [title], multiple: true, required: false, hint: "Leave empty to show a whole category instead" }
              - { label: Or show a whole category, name: category, widget: relation, collection: categories, value_field: slug, search_fields: [name], display_fields: [name], required: false, hint: "Used when no specific projects are picked. Leave both empty to show all projects." }
              - { label: Maximum to show, name: limit, widget: number, value_type: int, min: 1, required: false }
          - { label: Team, name: team, widget: object, summary: "Team — {{fields.title}}", fields: &sectionHeading [{ label: Small label, name: label, widget: string, required: false }, { label: Heading (new line = line break), name: title, widget: text, required: false }], hint: "Shows everyone in the Team collection" }
          - { label: Testimonials, name: testimonials, widget: object, summary: "Testimonials — {{fields.title}}", fields: *sectionHeading, hint: "Shows the Testimonials collection as a slider" }
          - { label: Perspectives articles, name: perspectives, widget: object, summary: "Perspectives — {{fields.title}}", fields: *sectionHeading, hint: "Shows cards for every Perspectives article" }
          - label: Clients marquee
            name: clients
            widget: object
            summary: "Clients marquee"
            fields:
              - { label: Small label, name: label, widget: string, required: false }
              - { label: Client names, name: items, widget: list, hint: "Comma separated" }
          - label: Image gallery
            name: gallery
            widget: object
            summary: "Gallery"
            fields:
              - { label: Images, name: images, widget: list, field: { label: Image, name: image, widget: image } }
          - label: Video
            name: video
            widget: object
            summary: "Video — {{fields.caption}}"
            fields:
              - { label: Video ID, name: videoId, widget: string, hint: "YouTube: the part after v= in the URL. Vimeo: the number." }
              - { label: Video platform, name: videoType, widget: select, options: [youtube, vimeo], default: youtube, required: false }
              - { label: Caption, name: caption, widget: string, required: false }
          - label: Call-to-action band
            name: cta
            widget: object
            summary: "Call-to-action — {{fields.title}}"
            fields:
              - { label: Small label, name: label, widget: string, required: false }
              - { label: Heading, name: title, widget: string }
              - { label: Heading emphasis (italic, new line), name: emphasis, widget: string, required: false }
              - { label: Subtitle, name: sub, widget: text, required: false }
              - { label: Button text, name: buttonLabel, widget: string }
              - { label: Button link, name: buttonLink, widget: string, required: false, hint: "Defaults to /contact. A site path or a full URL." }

  # ── Portfolio projects ────────────────────────────────────────────
  - name: projects
    label: Projects
    label_singular: Project
    folder: src/content/projects
    extension: json
    format: json
    create: true
    delete: true
    slug: "{{fields.slug}}"
    identifier_field: title
    summary: "{{title}} — {{type}}"
    sortable_fields: [order, title, type, year]
    fields:
      - *order
      - { label: URL slug, name: slug, widget: string, pattern: ["^[a-zA-Z0-9-]+$", "Letters, numbers and hyphens only"], hint: "Becomes the page address, e.g. /films/<slug>. Don't change it for an existing project or old links break." }
      - { label: Portfolio page, name: type, widget: relation, collection: categories, value_field: slug, search_fields: [name, slug], display_fields: [name], hint: "Which portfolio page this project appears on (add new ones under Categories). Changing it changes the project's address, e.g. /films/x → /events/x — old links to it will stop working." }
      - { label: Title, name: title, widget: string }
      - { label: Category, name: category, widget: string, hint: "e.g. Brand Film, Documentary" }
      - { label: Client, name: client, widget: string }
      - { label: Year, name: year, widget: string }
      - { label: Thumbnail, name: thumb, widget: image }
      - { label: Gallery images, name: images, widget: list, field: { label: Image, name: image, widget: image } }
      - { label: Description, name: description, widget: text }
      - { label: Tags, name: tags, widget: list, hint: "Comma separated" }
      - { label: Video ID, name: videoId, widget: string, required: false, hint: "YouTube: the part after v= in the URL. Vimeo: the number. Leave empty for an image gallery." }
      - { label: Video platform, name: videoType, widget: select, options: [youtube, vimeo], required: false }

  # ── Perspectives articles ─────────────────────────────────────────
  - name: perspectives
    label: Perspectives
    label_singular: Article
    folder: src/content/perspectives
    sortable_fields: [order]
    extension: json
    format: json
    create: true
    delete: true
    slug: "{{fields.slug}}"
    identifier_field: title
    fields:
      - *order
      - { label: URL slug, name: slug, widget: string, pattern: ["^[a-zA-Z0-9-]+$", "Letters, numbers and hyphens only"], hint: "Becomes /perspectives/<slug>" }
      - { label: Title, name: title, widget: string }
      - { label: Date, name: date, widget: string, required: false, hint: "Optional, e.g. October 2026. Hidden when empty." }
      - { label: Excerpt, name: excerpt, widget: text }
      - { label: Cover image, name: image, widget: image }
      - { label: Paragraphs, name: body, widget: list, field: { label: Paragraph, name: paragraph, widget: text } }

  # ── Testimonials ──────────────────────────────────────────────────
  - name: testimonials
    label: Testimonials
    label_singular: Testimonial
    folder: src/content/testimonials
    sortable_fields: [order]
    extension: json
    format: json
    create: true
    delete: true
    identifier_field: author
    summary: "{{author}} — {{company}}"
    fields:
      - *order
      - { label: Quote, name: quote, widget: text }
      - { label: Name, name: author, widget: string }
      - { label: Job title, name: role, widget: string, required: false }
      - { label: Organisation, name: company, widget: string }
      - { label: Photo, name: avatar, widget: image, required: false, hint: "Optional — initials are shown when empty" }
      - { label: Star rating, name: stars, widget: number, value_type: int, min: 1, max: 5, required: false, hint: "Optional — only fill in if the client actually gave one" }

  # ── Team ──────────────────────────────────────────────────────────
  - name: team
    label: Team
    label_singular: Team member
    folder: src/content/team
    sortable_fields: [order]
    extension: json
    format: json
    create: true
    delete: true
    identifier_field: name
    summary: "{{name}} — {{role}}"
    fields:
      - *order
      - { label: Name, name: name, widget: string }
      - { label: Role, name: role, widget: string }
      - { label: Department, name: dept, widget: string }
      - { label: Photo, name: img, widget: image }

  # ── Page copy (one form per page) ─────────────────────────────────
  - name: pages
    label: Pages
    files:
      - name: home
        label: Home
        file: src/content/pages/home.json
        fields:
          - label: Hero
            name: hero
            widget: object
            fields:
              - { label: Badge, name: badge, widget: string }
              - label: Headline lines
                name: headline
                widget: list
                fields:
                  - { label: Text, name: text, widget: string }
                  - { label: Outline style, name: ghost, widget: boolean, default: false }
              - { label: Accent character, name: accent, widget: string, required: false }
              - { label: Subtitle, name: sub, widget: text }
              - label: Stats
                name: stats
                widget: list
                fields:
                  - { label: Number, name: value, widget: string }
                  - { label: Label, name: label, widget: string }
              - label: Primary button
                name: primaryButton
                widget: object
                fields: &button
                  - { label: Text, name: label, widget: string }
                  - { label: Link, name: link, widget: string, hint: "e.g. /films" }
              - { label: Secondary button, name: secondaryButton, widget: object, fields: *button }
              - { label: Showreel YouTube ID, name: showreelYoutubeId, widget: string }
              - { label: Showreel label, name: showreelLabel, widget: string }
              - { label: Side text, name: sideText, widget: string }
              - { label: Scrolling ticker, name: ticker, widget: list, hint: "Comma separated" }
          - label: Selected work
            name: selectedWork
            widget: object
            fields:
              - { label: Small label, name: label, widget: string }
              - { label: View-all link text, name: viewAllLabel, widget: string }
              - { label: View-all link, name: viewAllLink, widget: string }
              - { label: Featured projects, name: projects, widget: relation, collection: projects, value_field: slug, search_fields: [title, client], display_fields: [title], multiple: true, hint: "The card uses each project's own thumbnail and title" }
          - label: Philosophy
            name: mission
            widget: object
            fields:
              - { label: Small label, name: label, widget: string }
              - { label: Quote, name: quote, widget: string }
              - { label: Quote emphasis (italic), name: quoteEmphasis, widget: string }
              - { label: Body, name: body, widget: text }
          - label: Services
            name: services
            widget: object
            fields:
              - { label: Small label, name: label, widget: string }
              - { label: Heading (new line = line break), name: title, widget: text }
              - label: Services
                name: items
                widget: list
                fields:
                  - { label: Title, name: title, widget: string }
                  - { label: Description, name: desc, widget: text }
                  - { label: Tags, name: tags, widget: list }
                  - { label: Link, name: link, widget: string }
          - label: Testimonials heading
            name: testimonials
            widget: object
            fields: &heading
              - { label: Small label, name: label, widget: string }
              - { label: Heading (new line = line break), name: title, widget: text }
          - { label: Team heading, name: team, widget: object, fields: *heading }
          - { label: Perspectives heading, name: perspectives, widget: object, fields: *heading }
          - label: Clients marquee
            name: clients
            widget: object
            fields:
              - { label: Small label, name: label, widget: string }
              - { label: Client names, name: items, widget: list, hint: "Comma separated" }
          - label: Bottom call-to-action
            name: cta
            widget: object
            fields:
              - { label: Small label, name: label, widget: string }
              - { label: Heading, name: title, widget: string }
              - { label: Heading emphasis (italic), name: emphasis, widget: string }
              - { label: Subtitle, name: sub, widget: text }
              - { label: Button text, name: buttonLabel, widget: string }

      - name: about
        label: About
        file: src/content/pages/about.json
        fields:
          - *hero
          - label: Story
            name: story
            widget: object
            fields:
              - { label: Image, name: image, widget: image }
              - { label: Badge number, name: badgeNumber, widget: string }
              - { label: Badge label, name: badgeLabel, widget: string }
              - { label: Small label, name: label, widget: string }
              - { label: Heading (new line = line break), name: title, widget: text }
              - { label: Paragraphs, name: paragraphs, widget: list, field: { label: Paragraph, name: paragraph, widget: text }, hint: "Wrap words in **double asterisks** for bold" }
              - { label: Closing line (bold), name: closing, widget: string, required: false }
              - { label: Button text, name: buttonLabel, widget: string }
          - label: Stats bar
            name: stats
            widget: list
            fields:
              - { label: Number, name: value, widget: string }
              - { label: Suffix (red), name: suffix, widget: string, required: false, hint: "e.g. +" }
              - { label: Label, name: label, widget: string }
          - { label: Team heading, name: team, widget: object, fields: *heading }
          - label: Values
            name: values
            widget: object
            fields:
              - { label: Small label, name: label, widget: string }
              - { label: Heading, name: title, widget: string }
              - label: Values
                name: items
                widget: list
                fields:
                  - { label: Title, name: title, widget: string }
                  - { label: Description, name: desc, widget: text }
          - label: What we do
            name: whatWeDo
            widget: object
            fields:
              - { label: Small label, name: label, widget: string }
              - { label: Heading (new line = line break), name: title, widget: text }
              - { label: Accent character, name: accent, widget: string, required: false }
              - label: Services
                name: items
                widget: list
                fields:
                  - { label: Title, name: title, widget: string }
                  - { label: Description, name: desc, widget: text }
              - { label: Button text, name: buttonLabel, widget: string }
              - { label: Button link, name: buttonLink, widget: string }

      - name: contact
        label: Contact
        file: src/content/pages/contact.json
        fields:
          - *hero
          - { label: Offices label, name: officesLabel, widget: string }
          - { label: Offices heading (new line = line break), name: officesTitle, widget: text }
          - label: Offices
            name: offices
            widget: list
            fields:
              - { label: City, name: city, widget: string }
              - { label: Address (new line = line break), name: address, widget: text }
              - label: Phone numbers
                name: phones
                widget: list
                fields:
                  - { label: Displayed as, name: label, widget: string }
                  - { label: Number to dial, name: number, widget: string, hint: "Digits only, e.g. +919841195181" }
          - label: Contact form
            name: form
            widget: object
            fields:
              - { label: Small label, name: label, widget: string }
              - { label: Heading, name: heading, widget: string }
              - { label: Service options, name: services, widget: list, hint: "Comma separated" }
              - { label: Success title, name: successTitle, widget: string }
              - { label: Success message, name: successText, widget: text }

      - name: careers
        label: Careers
        file: src/content/pages/careers.json
        fields:
          - *hero
          - { label: Culture images, name: cultureImages, widget: list, field: { label: Image, name: image, widget: image } }
          - label: Intro
            name: intro
            widget: object
            fields:
              - { label: Small label, name: label, widget: string }
              - { label: Heading (new line = line break), name: title, widget: text }
              - { label: Accent character, name: accent, widget: string, required: false }
              - { label: Text before email, name: textBeforeEmail, widget: text }
              - { label: Text after email, name: textAfterEmail, widget: text, hint: "The email address itself comes from Site settings" }
          - label: Perks
            name: perks
            widget: object
            fields:
              - { label: Small label, name: label, widget: string }
              - { label: Heading, name: title, widget: string }
              - label: Perks
                name: items
                widget: list
                fields:
                  - { label: Title, name: label, widget: string }
                  - { label: Description, name: desc, widget: text }
          - label: Job openings
            name: openings
            widget: object
            fields:
              - { label: Small label, name: label, widget: string }
              - { label: Heading, name: title, widget: string }
              - label: Openings
                name: items
                widget: list
                fields:
                  - { label: Role, name: role, widget: string }
                  - { label: Department, name: dept, widget: string }
                  - { label: Type, name: type, widget: string, hint: "e.g. Full-time" }
                  - { label: Location, name: location, widget: string }
          - label: Open application
            name: openApplication
            widget: object
            fields:
              - { label: Small label, name: label, widget: string }
              - { label: Heading, name: title, widget: string }
              - { label: Text, name: text, widget: string }
              - { label: Button text, name: buttonLabel, widget: string }

  # ── Site-wide settings ────────────────────────────────────────────
  - name: settings
    label: Site settings
    files:
      - name: site
        label: Contact details & footer
        file: src/content/site.json
        fields:
          - { label: Footer description, name: brandDescription, widget: text }
          - { label: Email, name: email, widget: string }
          - { label: Phone (displayed), name: phone, widget: string }
          - { label: Phone (number to dial), name: phoneHref, widget: string, hint: "Digits only" }
          - { label: Studio address (new line = line break), name: studioAddress, widget: text }
          - { label: Copyright line, name: copyright, widget: string }
          - label: Social links
            name: social
            widget: object
            fields:
              - { label: Facebook, name: facebook, widget: string }
              - { label: Instagram, name: instagram, widget: string }
              - { label: LinkedIn, name: linkedin, widget: string }
              - { label: YouTube, name: youtube, widget: string }
