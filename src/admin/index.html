<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>No Logo — Content Manager</title>
  <script>
    // Open the editor with the form at ~30% width and the live preview at ~70%. Decap keeps the
    // form at least 400px wide and remembers the position once the divider is dragged.
    try {
      if (!localStorage.getItem('cms.split-pane-position')) {
        localStorage.setItem('cms.split-pane-position', String(Math.max(400, Math.round(innerWidth * 0.3))));
      }
    } catch (e) { /* storage unavailable: Decap falls back to 50/50 */ }
  </script>
</head>
<body>
  <!-- Local-only CMS: served by `npm start` (development build), never included in docs/. -->
  <script src="https://unpkg.com/decap-cms@3.16.3/dist/decap-cms.js"></script>
  <script src="preview.js"></script>
</body>
</html>
