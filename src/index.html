<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>No Logo — Integrated Communication Agency</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="No Logo is an integrated communication agency offering film, photography and creative design services.">
  <meta name="keywords" content="nologo, communication agency, film, photography, design, CSR, Chennai">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <!-- SPA routing restore: reads path encoded by 404.html and restores it before Angular boots -->
  <script>
    (function(l) {
      if (l.search[1] === '/') {
        var decoded = l.search.slice(1).split('&').map(function(s) {
          return s.replace(/~and~/g, '&');
        });
        window.history.replaceState(null, null,
          l.pathname.slice(0, -1) + decoded[0] +
          (decoded.slice(1).join('&') ? '?' + decoded.slice(1).join('&') : '') +
          l.hash
        );
      }
    }(window.location));
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
