<section class="nl-blog section">
  @if (block.label || block.title) {
  <div class="blog-header reveal">
    @if (block.label) { <div class="section-label">{{ block.label }}</div> }
    @if (block.title) { <h2 class="section-title">{{ block.title }}</h2> }
  </div>
  }
  <div class="blog-grid">
    @for (post of posts; track post.slug) {
    <a [routerLink]="['/perspectives', post.slug]" class="blog-card reveal">
      <div class="blog-img-wrap">
        <img [src]="post.image" [alt]="post.title" class="blog-img" loading="lazy" />
      </div>
      <div class="blog-body">
        @if (post.date) { <span class="blog-date">{{ post.date }}</span> }
        <h3 class="blog-title">{{ post.title }}</h3>
        <span class="blog-link">Read More →</span>
      </div>
    </a>
    }
  </div>
</section>
